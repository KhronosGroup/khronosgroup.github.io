#
# Maps repositories to a standard. Groups render in this order.
# Matching order for a repository:
#   1. `repos` (exact name, any group)
#   2. `patterns` (case-insensitive regex on the name, first group wins)
#   3. `topics` (first group wins)
#   4. the group marked `fallback: true`
# Logos live in public/images/.

- id: vulkan
  title: Vulkan
  url: https://www.vulkan.org/
  logo: Round-Vulkan.png
  repos: [MoltenVK, VK-GL-CTS, VK-GL-CTS-Tools]
  patterns: ['^vulkan(?!sc)']
  topics: [vulkan]

- id: vulkansc
  title: Vulkan SC
  url: https://www.khronos.org/vulkansc/
  logo: Round-VulkanSC.png
  repos: [VulkanTools-ForSC]
  patterns: ['^vulkansc']
  topics: [vulkan-sc]

- id: gltf
  title: glTF
  url: https://www.khronos.org/gltf/
  logo: Round-glTF.png
  repos: [UnityGLTF, COLLADA2GLTF]
  patterns: ['^gltf']
  topics: [gltf]

- id: 3dcommerce
  title: 3D Commerce
  url: https://www.khronos.org/gltf/3dcommerce/
  logo: Round-3DComm.png
  repos: [3D-Formats-Guidelines]
  patterns: ['^3dc-']

- id: openxr
  title: OpenXR
